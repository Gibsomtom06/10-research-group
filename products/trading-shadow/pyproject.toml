[project]
name = "trading-shadow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "alpaca-py>=0.32.0",
    "discord.py>=2.4.0",
    "ollama>=0.4.0",
    "yfinance>=0.2.40",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0",
    "pytrends>=4.9.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
