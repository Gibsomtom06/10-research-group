<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Standard</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Public+Sans:wght@300;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #1E1E24; color: #E2E8F0; font-family: 'Public Sans', sans-serif; overflow: hidden; }
        
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #1E1E24;
            background-image: radial-gradient(#64748B 1px, transparent 1px);
            background-size: 40px 40px;
            position: relative;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .quote-container {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        .quote-mark {
            font-size: 120px;
            color: rgba(0, 229, 255, 0.1);
            font-family: 'JetBrains Mono', monospace;
            position: absolute;
            top: -60px;
            left: -40px;
            z-index: 0;
        }

        .main-quote {
            font-size: 48px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.2;
            position: relative;
            z-index: 1;
            max-width: 900px;
        }

        .quote-attribution {
            margin-top: 20px;
            font-family: 'JetBrains Mono', monospace;
            color: #00E5FF;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .pillars-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            width: 100%;
        }

        .pillar-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #333;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .pillar-icon {
            font-size: 32px;
            color: #64748B;
            margin-bottom: 20px;
        }

        .pillar-from {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #64748B;
            text-decoration: line-through;
            margin-bottom: 5px;
        }

        .pillar-arrow {
            color: #333;
            margin: 5px 0;
            font-size: 12px;
        }

        .pillar-to {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: #00E5FF;
            text-transform: uppercase;
        }

        .footer-bar {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #64748B;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-dot {
            width: 6px;
            height: 6px;
            background: #00E5FF;
            border-radius: 50%;
        }

    </style>
</head>
<body>
    <div class="slide-container">
        <div class="quote-container">
            <div class="quote-mark">"</div>
            <div class="main-quote">
                If we want to be better, we need to do better and have higher standards.
            </div>
            <div class="quote-attribution">// MISSION STATEMENT</div>
        </div>

        <div class="pillars-grid">
            <div class="pillar-card">
                <div class="pillar-icon"><i class="fas fa-random"></i></div>
                <div class="pillar-from">FROM CHAOS</div>
                <div class="pillar-arrow"><i class="fas fa-arrow-down"></i></div>
                <div class="pillar-to">TO INFRASTRUCTURE</div>
            </div>

            <div class="pillar-card">
                <div class="pillar-icon"><i class="fas fa-search-dollar"></i></div>
                <div class="pillar-from">FROM GUESSWORK</div>
                <div class="pillar-arrow"><i class="fas fa-arrow-down"></i></div>
                <div class="pillar-to">TO PRECISION</div>
            </div>

            <div class="pillar-card">
                <div class="pillar-icon"><i class="fas fa-chess-knight"></i></div>
                <div class="pillar-from">FROM REACTIVE</div>
                <div class="pillar-arrow"><i class="fas fa-arrow-down"></i></div>
                <div class="pillar-to">TO STRATEGIC</div>
            </div>
        </div>

        <div class="footer-bar">
            <div class="footer-item">
                <div class="footer-dot"></div>
                ARTIST BIBLE PLATFORM
            </div>
            <div class="footer-item">
                <div class="footer-dot"></div>
                DIRTYSNATCHA TOUR 2026
            </div>
            <div class="footer-item">
                <div class="footer-dot"></div>
                SYSTEM READY
            </div>
        </div>
    </div>
</body>
</html>
